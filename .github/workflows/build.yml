name: Build and tests
on:
  push:
    branches:
      - fix/18-hh-tests

jobs:
  common-steps:
    name: Install dependencies
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Use Node v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'
          registry-url: 'https://npm.pkg.github.com'
          always-auth: true
          scope: '@vechain'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}      

      - name: Install dependencies
        run: yarn install

  run-shard1:
    name: Run shard 1 of tests
    runs-on: ubuntu-latest
    needs: common-steps
    permissions:
      actions: read
      contents: read
      security-events: write
      packages: read

    steps:
      - name: Smart contract tests
        run: yarn test:shard1:compose:v2

  run-shard2:
    name: Run shard 2 of tests
    runs-on: ubuntu-latest
    needs: common-steps
    permissions:
      actions: read
      contents: read
      security-events: write
      packages: read

    steps:
      - name: Smart contract tests
        run: yarn test:shard2:compose:v2


